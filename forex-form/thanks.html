<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You – Forex Mentorship Program</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 500px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    text-align: center;
    padding: 45px 30px 35px;
    animation: popIn 0.6s ease;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Checkmark Animation */
  .check-circle {
    width: 90px;
    height: 90px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(17,153,142,0.4);
    animation: bounceIn 0.7s ease;
  }

  @keyframes bounceIn {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .check-circle svg {
    width: 48px;
    height: 48px;
    stroke: #fff;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: drawCheck 0.6s 0.4s ease forwards;
  }

  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  h1 {
    font-size: 1.7rem;
    color: #0f2027;
    margin-bottom: 12px;
  }

  .msg {
    font-size: 0.98rem;
    color: #556;
    line-height: 1.7;
    margin-bottom: 22px;
    padding: 0 10px;
  }

  .msg strong { color: #11998e; }

  .info-box {
    background: #f4fffb;
    border: 1.5px dashed #38ef7d;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 28px;
    font-size: 0.88rem;
    color: #2c5364;
    line-height: 1.8;
    text-align: left;
    overflow-wrap: anywhere;
  }

  .info-box .label {
    font-weight: 700;
    color: #11998e;
    display: inline-block;
    min-width: 90px;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    min-width: 140px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    border: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-wa {
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    box-shadow: 0 6px 18px rgba(37,211,102,0.35);
  }

  .btn-wa:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(37,211,102,0.5);
  }

  .footer {
    font-size: 0.8rem;
    color: #8899a6;
    margin-top: 26px;
    line-height: 1.6;
  }

  @media (max-width: 420px) {
    h1 { font-size: 1.4rem; }
    .btn { min-width: 100%; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="check-circle">
    <svg viewBox="0 0 52 52">
      <polyline points="14 27 23 36 38 18" />
    </svg>
  </div>

  <h1>Thank You! 🎉</h1>

  <p class="msg">
    Your form has been submitted successfully.<br>
    <strong>Malik Danish</strong> and the team will contact you shortly.
  </p>

  <div class="info-box" id="summaryBox">
    <div><span class="label">Name:</span> <span id="sName">—</span></div>
    <div><span class="label">Experience:</span> <span id="sExp">—</span></div>
    <div><span class="label">Goal:</span> <span id="sGoal">—</span></div>
    <div><span class="label">Start:</span> <span id="sStart">—</span></div>
    <div><span class="label">WhatsApp:</span> <span id="sWa">—</span></div>
    <div><span class="label">Email:</span> <span id="sEmail">—</span></div>
  </div>

  <div class="btn-row">
    <a class="btn btn-wa" id="waLink" href="#" target="_blank">
      💬 WhatsApp
    </a>
  </div>

  <div class="footer">
    Forex Mentorship Program<br>
    📱 0336 111 2960 &nbsp;|&nbsp; ✉️ malikdanish830@gmail.com
  </div>
</div>

<script>
  // Load form data from localStorage
  function get(key) {
    try { return localStorage.getItem(key) || "—"; } catch (e) { return "—"; }
  }

  const name  = get("forexName");
  const exp   = get("forexExp");
  const goal  = get("forexGoal");
  const start = get("forexStart");
  const wa    = get("forexWhatsapp");
  const email = get("forexEmail");

  document.getElementById("sName").textContent  = name;
  document.getElementById("sExp").textContent   = exp;
  document.getElementById("sGoal").textContent  = goal;
  document.getElementById("sStart").textContent = start;
  document.getElementById("sWa").textContent    = wa;
  document.getElementById("sEmail").textContent = email;

  // WhatsApp button link
  const adminNumber = "923361112960"; // 0336 111 2960
  let msg = "Hello! I have submitted the Forex Mentorship Program application form.\n\n";
  msg += "👤 Name: " + name + "\n";
  msg += "📈 Experience: " + exp + "\n";
  msg += "🎯 Goal: " + goal + "\n";
  msg += "⏰ Start: " + start + "\n";
  msg += "✉️ Email: " + email;

  document.getElementById("waLink").href =
    "https://wa.me/" + adminNumber + "?text=" + encodeURIComponent(msg);
</script>

</body>
</html>
