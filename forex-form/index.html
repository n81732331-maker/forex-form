<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Mentorship Program – Registration Form</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .form-container {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    overflow: hidden;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .form-header {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    padding: 26px 24px;
    text-align: center;
  }

  .form-header h1 { font-size: 1.4rem; margin-bottom: 8px; }
  .form-header p { font-size: 0.85rem; opacity: 0.95; line-height: 1.5; }

  .contact-bar {
    background: #0f2027;
    color: #b8f5e4;
    text-align: center;
    padding: 10px 16px;
    font-size: 0.8rem;
    line-height: 1.6;
    border-bottom: 1px solid #1e3a3a;
  }

  .contact-bar span { display: inline-block; margin: 0 8px; }

  form { padding: 26px 24px 30px; }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: #203a43;
    margin-bottom: 8px;
  }

  input[type="text"], input[type="tel"], input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e6ed;
    border-radius: 10px;
    font-size: 0.95rem;
    transition: all 0.25s ease;
    outline: none;
  }

  input[type="text"]:focus, input[type="tel"]:focus, input[type="email"]:focus {
    border-color: #11998e;
    box-shadow: 0 0 0 4px rgba(17,153,142,0.15);
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    border: 2px solid #e0e6ed;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.9rem;
    color: #334;
  }

  .option:hover { border-color: #38ef7d; background: #f4fffb; }

  .option input[type="radio"] {
    accent-color: #11998e;
    width: 17px; height: 17px;
    cursor: pointer;
  }

  .option:has(input[type="radio"]:checked) {
    border-color: #11998e;
    background: #eafaf7;
  }

  .option input[type="radio"]:checked + span {
    font-weight: 600;
    color: #11998e;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(17,153,142,0.4);
  }

  .submit-btn:active { transform: translateY(0); }

  .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

  .footer-note {
    text-align: center;
    font-size: 0.78rem;
    color: #8899a6;
    padding: 0 24px 22px;
    line-height: 1.5;
  }

  .mentor {
    text-align: center;
    font-size: 0.85rem;
    color: #203a43;
    font-weight: 600;
    padding-bottom: 18px;
  }

  @media (max-width: 480px) {
    .form-header h1 { font-size: 1.2rem; }
    form { padding: 20px 18px 24px; }
  }
</style>
</head>
<body>

<div class="form-container">
  <div class="form-header">
    <h1>📊 Forex Mentorship Program</h1>
    <p>Learn Forex One-on-One Online — From Zero to Advanced</p>
  </div>

  <!-- Contact Info Bar -->
  <div class="contact-bar">
    <span>📱 WhatsApp: 0336 111 2960</span>
    <span>✉️ malikdanish830@gmail.com</span>
  </div>

  <form id="forexForm">
    <div class="field">
      <label for="name">1. Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
    </div>

    <div class="field">
      <label for="whatsapp">2. Your WhatsApp Number</label>
      <input type="tel" id="whatsapp" name="whatsapp" placeholder="e.g. 0300 1234567" required>
    </div>

    <div class="field">
      <label for="email">3. Your Email</label>
      <input type="email" id="email" name="email" placeholder="e.g. name@gmail.com" required>
    </div>

    <div class="field">
      <label>4. What is your experience in trades?</label>
      <div class="options">
        <label class="option"><input type="radio" name="experience" value="Watched videos / small trades" required><span>Watched videos / small trades</span></label>
        <label class="option"><input type="radio" name="experience" value="Just watched videos"><span>Just watched videos</span></label>
        <label class="option"><input type="radio" name="experience" value="No experience yet"><span>No experience yet</span></label>
      </div>
    </div>

    <div class="field">
      <label>5. What is your goal?</label>
      <div class="options">
        <label class="option"><input type="radio" name="goal" value="Generate a side income" required><span>Generate a side income</span></label>
        <label class="option"><input type="radio" name="goal" value="Learn a high-income skill"><span>Learn a high-income skill</span></label>
      </div>
    </div>

    <div class="field">
      <label>6. When do you want to start?</label>
      <div class="options">
        <label class="option"><input type="radio" name="start" value="Immediately" required><span>Immediately</span></label>
        <label class="option"><input type="radio" name="start" value="After 1 week"><span>After 1 week</span></label>
        <label class="option"><input type="radio" name="start" value="After 1 month"><span>After 1 month</span></label>
        <label class="option"><input type="radio" name="start" value="Will start anytime in life"><span>Will start anytime in life</span></label>
      </div>
    </div>

    <button type="submit" class="submit-btn">Submit Application</button>
  </form>

  <div class="mentor">Mentor: Malik Danish</div>
  <div class="footer-note">
    Chart reading • Risk management • Candlestick psychology<br>
    Personal one-on-one online sessions at your own pace.
  </div>
</div>

<script>
  // Apna Google Apps Script Web App URL yahan paste karein
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfs7eqrKU7eJIpEEbRdaBr9LaAPJdri_3cuSKr3AG4R1Pk7eThk8--36ToJ-45O_CD/exec";

  document.getElementById("forexForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const form = this;
    const btn = form.querySelector(".submit-btn");
    const data = new FormData(form);

    btn.disabled = true;
    btn.textContent = "Submitting...";

    // Thank-you page ke liye data save
    try {
      localStorage.setItem("forexName", data.get("name"));
      localStorage.setItem("forexWhatsapp", data.get("whatsapp"));
      localStorage.setItem("forexEmail", data.get("email"));
      localStorage.setItem("forexExp", data.get("experience"));
      localStorage.setItem("forexGoal", data.get("goal"));
      localStorage.setItem("forexStart", data.get("start"));
    } catch (err) {}

    // Google Sheet mein data bhejna
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams(data)
    })
    .then(() => {
      window.location.href = "thanks.html";
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Submit Application";
      alert("Kuch masla aa gaya, dobara try karein.");
    });
  });
</script>

</body>
</html>
